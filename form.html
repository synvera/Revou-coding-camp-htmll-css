<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form — Belajar HTML</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-900 antialiased">
    <header class="border-b border-zinc-200 bg-white">
        <div class="mx-auto flex max-w-5xl flex-col gap-4 px-6 py-5 sm:flex-row sm:items-center sm:justify-between">
            <a href="index.html" class="text-sm font-semibold tracking-tight">HTML / CSS <span class="font-normal text-zinc-500">— Catatan belajar</span></a>
            <nav aria-label="Navigasi utama" class="flex flex-wrap gap-x-5 gap-y-2 text-sm text-zinc-600">
                <a href="index.html" class="transition hover:text-black">Beranda</a>
                <a href="list.html" class="transition hover:text-black">List</a>
                <a href="form.html" aria-current="page" class="font-medium text-zinc-950 underline underline-offset-4">Form</a>
                <a href="tabel.html" class="transition hover:text-black">Tabel</a>
                <a href="image.html" class="transition hover:text-black">Gambar</a>
            </nav>
        </div>
    </header>
    <main class="mx-auto max-w-5xl px-6 py-12 sm:py-16">
        <div class="mb-8">
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-zinc-500">Materi 02 · Elemen HTML</p>
            <h1 class="mt-3 text-4xl font-semibold tracking-tight">Form</h1>
            <p class="mt-3 max-w-2xl leading-7 text-zinc-600">Contoh beberapa kontrol form untuk menerima teks dan pilihan dari pengguna.</p>
        </div>
        <form method="post" class="max-w-2xl space-y-6 rounded-2xl border border-zinc-200 bg-white p-6 shadow-sm sm:p-8">
            <div class="space-y-2">
                <label for="nama" class="block text-sm font-medium">Nama</label>
                <input id="nama" name="nama" type="text" class="w-full rounded-lg border border-zinc-300 px-3 py-2.5 text-sm outline-none transition placeholder:text-zinc-400 focus:border-zinc-950 focus:ring-2 focus:ring-zinc-200">
            </div>
            <div class="grid gap-4 sm:grid-cols-2">
                <label class="flex items-center gap-3 rounded-lg border border-zinc-200 p-3 text-sm text-zinc-700">
                    <input type="checkbox" name="berlangganan" class="size-4 accent-zinc-950">
                    Berlangganan
                </label>
                <label class="flex items-center gap-3 rounded-lg border border-zinc-200 p-3 text-sm text-zinc-700">
                    <input type="radio" name="jenis" value="umum" class="size-4 accent-zinc-950">
                    Pilihan radio
                </label>
            </div>
            <div class="space-y-2">
                <label for="kata-sandi" class="block text-sm font-medium">Kata sandi</label>
                <input id="kata-sandi" name="kata-sandi" type="password" class="w-full rounded-lg border border-zinc-300 px-3 py-2.5 text-sm outline-none transition focus:border-zinc-950 focus:ring-2 focus:ring-zinc-200">
            </div>
            <div class="space-y-2">
                <label for="pesan" class="block text-sm font-medium">Pesan</label>
                <textarea id="pesan" name="pesan" rows="4" class="w-full resize-y rounded-lg border border-zinc-300 px-3 py-2.5 text-sm outline-none transition placeholder:text-zinc-400 focus:border-zinc-950 focus:ring-2 focus:ring-zinc-200">Ketik apa saja di dalam sini</textarea>
            </div>
            <fieldset class="space-y-3 rounded-lg border border-zinc-200 p-4">
                <legend class="px-1 text-sm font-medium">Apa warna kesukaan Kak Rani?</legend>
                <label for="warna" class="block text-sm text-zinc-600">Pilih satu warna</label>
                <select id="warna" name="warna" class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2.5 text-sm outline-none focus:border-zinc-950 focus:ring-2 focus:ring-zinc-200">
                    <optgroup label="Pilihan warna">
                        <option>Merah</option>
                        <option>Biru</option>
                        <option>Hijau</option>
                    </optgroup>
                </select>
            </fieldset>
            <button type="submit" class="rounded-lg bg-zinc-950 px-5 py-2.5 text-sm font-medium text-white transition hover:bg-zinc-700 focus:outline-none focus:ring-2 focus:ring-zinc-400 focus:ring-offset-2">Simpan</button>
        </form>
    </main>
    <footer class="mx-auto max-w-5xl px-6 pb-8 text-xs text-zinc-500">Latihan HTML & CSS · Revou Coding Camp</footer>
</body>
</html>
