<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel — Belajar HTML</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-zinc-50 text-zinc-900 antialiased">
    <header class="border-b border-zinc-200 bg-white">
        <div class="mx-auto flex max-w-5xl flex-col gap-4 px-6 py-5 sm:flex-row sm:items-center sm:justify-between">
            <a href="index.html" class="text-sm font-semibold tracking-tight">HTML / CSS <span class="font-normal text-zinc-500">— Catatan belajar</span></a>
            <nav aria-label="Navigasi utama" class="flex flex-wrap gap-x-5 gap-y-2 text-sm text-zinc-600">
                <a href="index.html" class="transition hover:text-black">Beranda</a>
                <a href="list.html" class="transition hover:text-black">List</a>
                <a href="form.html" class="transition hover:text-black">Form</a>
                <a href="tabel.html" aria-current="page" class="font-medium text-zinc-950 underline underline-offset-4">Tabel</a>
                <a href="image.html" class="transition hover:text-black">Gambar</a>
            </nav>
        </div>
    </header>
    <main class="mx-auto max-w-5xl px-6 py-12 sm:py-16">
        <div class="mb-8">
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-zinc-500">Materi 03 · Elemen HTML</p>
            <h1 class="mt-3 text-4xl font-semibold tracking-tight">Tabel</h1>
            <p class="mt-3 max-w-2xl leading-7 text-zinc-600">Tabel mengatur data ke dalam baris dan kolom agar lebih mudah dibaca.</p>
        </div>
        <div class="overflow-hidden rounded-2xl border border-zinc-200 bg-white shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full min-w-[28rem] border-collapse text-left text-sm">
                    <caption class="sr-only">Daftar nama dan lokasi</caption>
                    <thead class="bg-zinc-950 text-white">
                        <tr>
                            <th scope="col" class="px-6 py-4 font-medium">No.</th>
                            <th scope="col" class="px-6 py-4 font-medium">Nama</th>
                            <th scope="col" class="px-6 py-4 font-medium">Lokasi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-zinc-100 text-zinc-700">
                        <tr class="transition hover:bg-zinc-50">
                            <td class="px-6 py-4 text-zinc-500">01</td>
                            <td class="px-6 py-4 font-medium text-zinc-950">Kahfi</td>
                            <td class="px-6 py-4">Indonesia</td>
                        </tr>
                        <tr class="transition hover:bg-zinc-50">
                            <td class="px-6 py-4 text-zinc-500">02</td>
                            <td class="px-6 py-4 font-medium text-zinc-950">Kahfi</td>
                            <td class="px-6 py-4">Indonesia</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    <footer class="mx-auto max-w-5xl px-6 pb-8 text-xs text-zinc-500">Latihan HTML & CSS · Revou Coding Camp</footer>
</body>
</html>
